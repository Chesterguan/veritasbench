# Provider configuration for VeritasBench adapters.
#
# Each entry maps a short-name to:
#   - adapter:      which adapter script to invoke
#   - env:          env vars to set before invocation
#   - key_env:      name of the env var that holds the API key
#   - category:     one of chinese_general, chinese_medical, western_general,
#                   western_medical. Used by scripts/aggregate_models.py to group
#                   results in reports.
#   - display_name: human-readable label for tables/charts
#
# Usage:
#   python scripts/run_model.py <short-name>
#
# The key itself must live in your local .env file (gitignored) — never
# commit real API keys. See .env.example for the template.

gpt-4o-mini:
  adapter: llm_openai_compat.py
  env:
    OPENAI_BASE_URL: https://api.openai.com/v1
    VERITASBENCH_MODEL: gpt-4o-mini
  key_env: OPENAI_API_KEY
  category: western_general
  display_name: GPT-4o-mini

deepseek-v3:
  adapter: llm_openai_compat.py
  env:
    OPENAI_BASE_URL: https://openrouter.ai/api/v1
    VERITASBENCH_MODEL: deepseek/deepseek-v3.2
