# ── Western medical (local via Ollama) ─────────────────────────────────────

medgemma-4b:
  adapter: llm_openai_compat.py
  env:
    OPENAI_BASE_URL: http://localhost:11434/v1
    VERITASBENCH_MODEL: medgemma:4b
  key_env: OPENAI_API_KEY  # Ollama ignores auth; any non-empty value works
  category: western_medical
  display_name: MedGemma 4B (Google)

# meditron-7b and meditron3-8b were tested on 2026-04-24 but removed from
# the suite: 7b (Llama 2, Ollama) had 28% timeout rate (trained on clinical QA,
# doesn't follow JSON-only prompts); 3-8b (Q4_K_M GGUF) scored 57% Policy,
# likely dominated by 4-bit quantization loss rather than medical
# specialization signal. See docs/future-work/benchmark-realism-improvements.md.

meditron-70b:
  adapter: llm_openai_compat.py
  env:
    OPENAI_BASE_URL: https://openrouter.ai/api/v1
    VERITASBENCH_MODEL: epfl-llm/meditron-70b
  key_env: OPENROUTER_API_KEY
  category: western_medical
  display_name: Meditron 70B (EPFL, original)
  # If not available on OpenRouter, swap to:
  #   OPENAI_BASE_URL: https://api.together.xyz/v1
  #   key_env: TOGETHER_API_KEY
